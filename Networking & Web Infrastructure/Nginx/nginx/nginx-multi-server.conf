# This configuration shows multiple servers listening on the same port
# but with different server_name directives to distinguish between them

# @docs: https://nginx.org/en/docs/http/server_names.html
# @docs: https://nginx.org/en/docs/http/request_processing.html


worker_processes auto;


events {
    worker_connections 1024;
}

http {

    # Default server - catches all unmatched hostnames
    # curl http://localhost:8080
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;  # Catch-All any unmatched hostname
        
        location / {
            root /usr/share/nginx/html;
            index index.html;
        }
    }

    # Domain-1 server - Same port - only match if header contains "Host: domain-1.com"
    # curl -H "Host: domain-1.com" http://localhost:8080
    server {
        listen 80;
        listen [::]:80;
        server_name domain-1.com;

        location / {
            default_type text/plain;
            return 200 "Hello from domain-1.com\n";
        }
    }

    # Domain-2 server - Different port
    # Match if port is 9999
    # curl http://localhost:9999
    server {
        listen 9999;
        server_name domain-2.com;

        location / {
            default_type text/plain;
            return 200 "Hello from domain-2.com\n";
        }
    }
}
