# Reverse Proxy Configuration
# shows how to route requests to different services based on the path

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        location / { # curl http://localhost:8080
            default_type text/plain;
            return 200 "Default server\n";
        }

        location /service-a { # curl http://localhost:8080/service-a
            # Use Docker service name for container-to-container communication
            proxy_pass http://service-a:3001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /service-b { # curl http://localhost:8080/service-b
            # Use Docker service name for container-to-container communication
            proxy_pass http://service-b:3002;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}